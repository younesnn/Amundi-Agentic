name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Installer Python et les dépendances
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (sans LLM ni réseau)
        run: uv run pytest -m "not llm and not network" --cov=amundi_agentic
