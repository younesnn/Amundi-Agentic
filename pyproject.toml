[project]
name = "amundi-agentic"
version = "0.0.1"
description = "Système d'agents IA pour la construction de portefeuilles multi-actifs (prototype académique ESCP pour Amundi Technology)."
readme = "README.md"
requires-python = ">=3.11"
# Les dépendances métier sont ajoutées phase par phase (voir DECISIONS.md).
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amundi_agentic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "llm: test qui appelle un vrai LLM (exclu par défaut en CI)",
    "network: test qui appelle une source de données en ligne (exclu par défaut en CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prompts", "fiches", "graphify-out", "PROMPT.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
