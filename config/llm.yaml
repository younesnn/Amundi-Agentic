# Configuration LLM : les noms de modèles vivent ici, jamais dans le code (C1, D-008).
# Identifiants au format LiteLLM « fournisseur/modèle ». Budget 0 € : aucun fournisseur payant.
# Les clés sont lues dans .env via les variables indiquées ; elles ne figurent jamais ici.

providers:
  gemini:
    api_key_env: GEMINI_API_KEY
  groq:
    api_key_env: GROQ_API_KEY
  ollama:
    api_base_env: OLLAMA_API_BASE

models:
  # Moteur principal : tous les agents, y compris le coordinateur et l'agent Fundamental.
  main: gemini/gemini-flash-latest
  # Tâches simples : résumés de news, extraction.
  light: gemini/gemini-flash-lite-latest
  # Relais automatique sur erreur de quota (429) des modèles Gemini.
  fallback: groq/openai/gpt-oss-120b
  # Développement et tests : local, ne consomme aucun quota.
  dev: ollama/llama3.1:8b

# Ordre de relais pour chaque niveau en production.
fallback_order:
  main: [main, fallback]
  light: [light, main, fallback]

# Mode évaluation (D-024) : identifiants à version figée, un seul modèle par run, aucun relais.
# Sur erreur 429 : pause puis reprise depuis le cache ; le run s'arrête si le modèle servi change.
# Versions relevées le 2026-10-02 (champ `modelVersion` renvoyé par l'API). La date de fin
# d'entraînement de chacune reste à relever avant le pré-enregistrement (D-025, D-027).
evaluation:
  fallback_enabled: false
  models:
    main: gemini/gemini-3.8-flash
    light: gemini/gemini-3.5-flash-lite

# Mode d'exécution par défaut : « dev » (Ollama) ou « prod » (Gemini + relais Groq).
default_mode: dev

defaults:
  temperature: 0
  # Graine enregistrée dans chaque ExecutionRecord (EX-NF-10) ; transmise au fournisseur.
  seed: 0
  timeout_s: 900   # (H) 120 s expirait avec Ollama local sur des prompts de 2 000 jetons ou plus (D-058) ; 900 s tient les appels du débat et du RAG avec num_ctx 16384
  max_output_tokens: 2048   # (H) borne les générations sans fin d'un petit modèle à température 0 (D-068) ; une vue ou un rapport tient largement dessous
  # Sortie structurée invalide : nouvelles tentatives avec rappel des erreurs de validation.
  structured_retries: 2

# Cache disque (EX-NF-04) : clé = SHA-256(version du schéma de clé, modèle demandé, messages,
# schéma, paramètres dont num_ctx pour Ollama, date_donnees). La version du schéma de clé a été
# incrémentée (D-062) : les caches produits avec le contexte tronqué par défaut ne sont plus lus.
# Chemin relatif à la racine du dépôt (.cache/ est ignoré par Git).
cache:
  enabled: true
  dir: .cache/llm

# Ollama (D-062). Sans `num_ctx`, Ollama tronque EN SILENCE les prompts à environ 2 000 jetons
# (mesuré : prompt de ~9 000 jetons -> 2 050 évalués). Valeur retenue (H) : 16 384, qui tient en
# mémoire sur le Mac de développement de 16 Go avec llama3.1:8b. Pour la changer : modifier la
# ligne ci-dessous (32768 si la mémoire le permet). Mesuré : 16 384 occupe 6,9 Go (100 % GPU) ;
# 8 192 si contention mémoire (les prompts de débat mesurés dépassent déjà 5 000 jetons : vérifier
# avant de réduire). Elle entre dans la clé de cache : changer la valeur recalcule les réponses,
# jamais de réutilisation d'un autre contexte. Obligatoire dès qu'un modèle Ollama est configuré.
ollama:
  num_ctx: 16384

# Détection de troncature silencieuse (D-062), pour les fournisseurs listés. Estimation prudente
# du prompt : caractères / chars_per_token (4,5 : texte anglais ; le français et les nombres en
# donnent plus de jetons, donc l'estimation reste basse). Contrôle seulement au-dessus de
# min_estimated_tokens (pas de faux positif sur prompts courts). Si jetons évalués par le serveur
# < min_ratio x estimation : PromptTronque, sans relais ni cache. Ratios et seuil : H.
# Saturation : jetons évalués >= saturation_ratio x num_ctx (0,98, H) : PromptTronque (motif
# saturation), car une troncature à num_ctx laisse un rapport proche de 1. Usage (jetons du prompt)
# absent ou nul : détection « aveugle » (journalisée, avertissement unique) ; en évaluation, erreur
# UsageInconnu si exiger_usage_en_evaluation.
truncation_check:
  providers: [ollama]
  chars_per_token: 4.5
  min_estimated_tokens: 1000
  min_ratio: 0.5
  saturation_ratio: 0.98
  exiger_usage_en_evaluation: true

# Nouvelles tentatives sur erreur 503 et timeout (attente exponentielle) et pauses sur 429.
retry:
  max_attempts: 4            # tentatives totales par modèle sur 503 ou timeout
  backoff_base_s: 2
  backoff_factor: 2
  backoff_max_s: 60
  # Mode évaluation : sur 429, attente puis nouvelle tentative, puis arrêt propre de l'exécution
  # (reprise depuis le cache). Valeurs d'hypothèse (H), à régler quand les quotas sont relevés.
  pause_429_wait_s: 65
  pause_429_max_waits: 2

# Mode interactif : relais vers le modèle suivant de fallback_order.
relay:
  # Un modèle qui vient de répondre 429 est évité pendant cette durée (secondes).
  cooldown_s: 60
  # Relayer aussi quand les tentatives sur 503 ou timeout sont épuisées.
  on_unavailable_exhausted: true

# Journal des quotas (par fournisseur et par jour) et alerte avant la limite (EX-NF-03).
# Les limites sont à relever sur les pages officielles des niveaux gratuits (D-004) : `null`
# tant qu'elles ne sont pas relevées (aucune valeur inventée). Clé : un fournisseur (gemini,
# groq, ollama) ou un identifiant complet de modèle, qui l'emporte sur le fournisseur.
quotas:
  alert_threshold: 0.8
  # Fuseau de la remise à zéro quotidienne ; à relever (UTC en attendant).
  day_timezone: UTC
  journal: .cache/llm/quotas.json
  limits:
    gemini: {requests_per_day: null, requests_per_minute: null, tokens_per_minute: null}
    groq: {requests_per_day: null, requests_per_minute: null, tokens_per_minute: null}
    # Groq, niveau gratuit, relevé le 2026-10-03 (D-052, source https://console.groq.com/docs/rate-limits,
    # lue par un outil de résumé : à revérifier avant le pré-enregistrement) : 30 requêtes/min,
    # 1 000 requêtes/jour, 8 000 tokens/min, et 200 000 tokens/JOUR (limite non représentée ici :
    # c'est le facteur limitant du relais, qui ne convient donc qu'aux appels courts).
    groq/openai/gpt-oss-120b: {requests_per_day: 1000, requests_per_minute: 30, tokens_per_minute: 8000}
    # Gemini : limites du niveau gratuit non publiées (lisibles seulement dans Google AI Studio,
    # compte connecté) : à relever à la main (D-052). Restent null.
    ollama: {requests_per_day: null, requests_per_minute: null, tokens_per_minute: null}

# Coût en euros par million de jetons. Niveaux gratuits : 0. Le calcul existe pour que le coût
# reste mesuré si un fournisseur devient payant (cout_eur de l'ExecutionRecord).
pricing:
  gemini: {input_eur_per_mtok: 0, output_eur_per_mtok: 0}
  groq: {input_eur_per_mtok: 0, output_eur_per_mtok: 0}
  ollama: {input_eur_per_mtok: 0, output_eur_per_mtok: 0}

# Embeddings (EX-NF-14), par profil d'exécution. Groq n'en propose pas : pas de relais.
# L'identifiant Gemini n'a pas été testé (aucun appel Gemini en phase 3, tâche 1).
# Profil dev : llama3.1:8b ne sait pas produire d'embeddings (testé en local, 2026-10-03) ; il faut
# un modèle d'embedding local, à installer une fois (`ollama pull nomic-embed-text`).
embeddings:
  prod: gemini/gemini-embedding-001
  dev: ollama/nomic-embed-text

# Date de fin d'entraînement par modèle servi (EX-O5-06), à relever avant le pré-enregistrement
# (D-025). Clé : identifiant renvoyé par le fournisseur ; valeur : date AAAA-MM-JJ.
training_cutoff:
  # Fin des données d'entraînement (D-052, relevé le 2026-10-03). Quand la source ne donne que le
  # mois, on retient le DERNIER jour du mois : borne haute prudente pour la contamination (D-025).
  # Gemini 3.x : « mars 2026 pour certains domaines, janvier 2025 pour d'autres » (carte du modèle
  # DeepMind) ; la borne retenue est mars 2026.
  gemini-3.8-flash: "2026-03-31"
  gemini-3.5-flash-lite: "2026-03-31"
  # gpt-oss-120b : juin 2024, indice officiel INDIRECT (exemple du format Harmony), pas la fiche du modèle.
  openai/gpt-oss-120b: "2024-06-30"
  # Llama 3.1 : décembre 2023 (fiche de modèle de Meta).
  llama3.1:8b: "2023-12-31"
